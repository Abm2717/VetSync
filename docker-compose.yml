services:
  postgres:
    image: postgres:16-alpine
    container_name: vetsync-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vetsync}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vetsync}
      POSTGRES_DB: ${POSTGRES_DB:-vetsync}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - vetsync_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vetsync} -d ${POSTGRES_DB:-vetsync}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  vetsync_postgres_data:
